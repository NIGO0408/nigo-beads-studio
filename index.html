<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NicoRate BEADS STUDIO - Prototype 0.5</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#222;background:#f4f5f7}
*{box-sizing:border-box}body{margin:0}header{background:#24104f;color:#fff;padding:18px 20px}
header h1{font-size:20px;margin:0 0 4px}header p{margin:0;color:#ddd;font-size:13px}
main{max-width:1100px;margin:20px auto;padding:0 14px}
.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
label.upload{display:block;border:1px dashed #aaa;border-radius:9px;padding:13px;background:#fafafa;font-size:14px}
input[type=file]{display:block;margin-top:8px;max-width:100%}
button{background:#4d2b91;color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.view-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.view-controls button{padding:9px 13px;font-size:13px;background:#5b4a78}
.view-controls button.active{background:#2f7d48}
#result{display:block;max-width:100%;height:auto;margin:auto;image-rendering:pixelated;background:white}
.note{font-size:12px;color:#666;line-height:1.6}.status{font-size:13px;color:#444;margin-top:10px;white-space:pre-wrap}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.preview-wrap{overflow:auto;max-height:75vh;background:#eee;padding:10px;border-radius:8px;text-align:center}
#result{display:block;max-width:100%;height:auto;margin:auto;image-rendering:pixelated;background:white}
#palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:7px}
.swatch{display:flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:7px;padding:6px;font-size:12px}
.color{width:25px;height:25px;border:1px solid #999;flex:none}
@media(max-width:600px){header h1{font-size:18px}.panel{padding:12px}}
</style>
</head>
<body>
<header><h1>NicoRate BEADS STUDIO</h1><p>アイロンビーズ図案メーカー｜試作版 0.5（番号付き図案・反転対応）</p></header>
<main>
<section class="panel">
<h2>1. 画像を読み込む</h2>
<div class="inputs">
<label class="upload">元イラスト（格子なし）
<input id="sourceFile" type="file" accept="image/png,image/jpeg,image/webp">
</label>
<label class="upload">格子を重ねた画像
<input id="gridFile" type="file" accept="image/png,image/jpeg,image/webp">
</label>
</div>
<p class="note">2枚は同じイラスト・同じ縦横比で用意してください。格子画像は黒など、背景や絵と区別しやすい線がおすすめです。</p>
<div class="actions"><button id="convert" disabled>図案に変換</button><button id="download" disabled>図案PNGを保存</button></div>
<div id="status" class="status">2枚の画像を選択してください。</div>
</section>
<section class="panel">
<h2>2. 変換結果</h2>
<div class="stats"><span id="dimensions">マス目：未検出</span><span id="count">使用色数：-</span><span id="cells">総マス数：-</span></div>
<p class="note">各マスの中央付近を元イラストからサンプリングしています。番号は色ごとの管理番号です。</p>
<div class="view-controls">
<button id="gridToggle" class="active" type="button">マス目：ON</button>
<button id="numberToggle" class="active" type="button">番号：ON</button>
<button id="flipH" type="button">左右反転</button>
<button id="flipV" type="button">上下反転</button>
</div>
<div class="preview-wrap"><canvas id="result"></canvas></div>
</section>
<section class="panel">
<h2>3. 色の使用数（RGB）</h2>
<div id="palette" class="note">変換すると色別のマス数が表示されます。</div>
</section>
</main>
<script>
const sourceInput=document.getElementById('sourceFile'), gridInput=document.getElementById('gridFile');
const convertBtn=document.getElementById('convert'), downloadBtn=document.getElementById('download');
const statusEl=document.getElementById('status'), canvas=document.getElementById('result'), ctx=canvas.getContext('2d',{willReadFrequently:true});
let sourceImg=null,gridImg=null,lastColors=null,lastNumbers=null;
let showGrid=true,showNumbers=true,flipHorizontal=false,flipVertical=false;
const gridToggle=document.getElementById('gridToggle'),numberToggle=document.getElementById('numberToggle');
const flipHBtn=document.getElementById('flipH'),flipVBtn=document.getElementById('flipV');
function loadImage(file){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};im.onerror=reject;im.src=u})}
async function refresh(){try{sourceImg=sourceInput.files[0]?await loadImage(sourceInput.files[0]):null;gridImg=gridInput.files[0]?await loadImage(gridInput.files[0]):null;convertBtn.disabled=!(sourceImg&&gridImg);statusEl.textContent=convertBtn.disabled?'2枚の画像を選択してください。':'画像を読み込みました。図案に変換できます。';}catch(e){statusEl.textContent='画像を読み込めませんでした。PNG/JPEG画像を確認してください。'}}
sourceInput.addEventListener('change',refresh);gridInput.addEventListener('change',refresh);
function imageData(im){const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);return {data:x.getImageData(0,0,c.width,c.height).data,w:c.width,h:c.height}}
function lineScores(d,axis){const n=axis==='x'?d.w:d.h,other=axis==='x'?d.h:d.w,s=new Float32Array(n);for(let p=0;p<n;p++){let dark=0;for(let q=0;q<other;q++){const i=axis==='x'?(q*d.w+p)*4:(p*d.w+q)*4;const r=d.data[i],g=d.data[i+1],b=d.data[i+2];if(r<75&&g<75&&b<75)dark++}s[p]=dark/other}return s}
function findLines(scores){let peaks=[];for(let i=0;i<scores.length;i++)if(scores[i]>.48)peaks.push(i);let groups=[];for(const p of peaks){if(!groups.length||p>groups[groups.length-1].end+1)groups.push({start:p,end:p,sum:p,n:1});else{let z=groups[groups.length-1];z.end=p;z.sum+=p;z.n++}}return groups.filter(g=>g.n<=4).map(g=>Math.round(g.sum/g.n))}
function detectAxis(scores){
 let best=null;
 for(let pitch=8;pitch<=20;pitch+=.1){
  for(let phase=0;phase<pitch;phase+=.5){
   let pos=[];for(let x=phase;x<scores.length;x+=pitch)pos.push(Math.round(x));
   if(pos.length<4)continue;
   let mean=pos.reduce((v,x)=>v+(scores[x]||0),0)/pos.length;
   if(!best||mean>best.mean)best={mean,pitch,phase,pos};
  }
 }
 if(!best||best.mean<.35)throw Error('格子線を検出できません。線を黒く、均等にしてください。');
 // Refine each predicted line to the darkest nearby pixel.
 return best.pos.map(x=>{let lo=Math.max(0,x-2),hi=Math.min(scores.length-1,x+2),b=x;for(let j=lo;j<=hi;j++)if(scores[j]>scores[b])b=j;return b})
}
function detectGrid(d){
 let xs=detectAxis(lineScores(d,'x')),ys=detectAxis(lineScores(d,'y'));
 if(xs.length<3||ys.length<3)throw Error('格子線を十分に検出できません。');
 return {xs,ys,cols:xs.length-1,rows:ys.length-1}
}
function sampleAverage(d,x,y,rx,ry){let rr=0,gg=0,bb=0,n=0;for(let yy=Math.max(0,Math.floor(y-ry));yy<=Math.min(d.h-1,Math.ceil(y+ry));yy++)for(let xx=Math.max(0,Math.floor(x-rx));xx<=Math.min(d.w-1,Math.ceil(x+rx));xx++){let i=(yy*d.w+xx)*4;rr+=d.data[i];gg+=d.data[i+1];bb+=d.data[i+2];n++}return [Math.round(rr/n),Math.round(gg/n),Math.round(bb/n)]}
function renderPattern(){
 if(!lastColors)return;
 const rows=lastColors.length,cols=lastColors[0].length,cell=24;
 canvas.width=cols*cell;canvas.height=rows*cell;ctx.imageSmoothingEnabled=false;
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
   const sx=flipHorizontal?cols-1-x:x,sy=flipVertical?rows-1-y:y;
   const color=lastColors[sy][sx],number=lastNumbers[sy][sx];
   ctx.fillStyle=`rgb(${color.join(',')})`;ctx.fillRect(x*cell,y*cell,cell,cell);
   if(showGrid){ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.strokeRect(x*cell+.5,y*cell+.5,cell,cell)}
   if(showNumbers){
     const luminance=.299*color[0]+.587*color[1]+.114*color[2];
     ctx.fillStyle=luminance>150?'#111':'#fff';
     ctx.font='bold 13px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
     ctx.fillText(String(number),x*cell+cell/2,y*cell+cell/2);
   }
 }
}
gridToggle.addEventListener('click',()=>{showGrid=!showGrid;gridToggle.textContent=`マス目：${showGrid?'ON':'OFF'}`;gridToggle.classList.toggle('active',showGrid);renderPattern()});
numberToggle.addEventListener('click',()=>{showNumbers=!showNumbers;numberToggle.textContent=`番号：${showNumbers?'ON':'OFF'}`;numberToggle.classList.toggle('active',showNumbers);renderPattern()});
flipHBtn.addEventListener('click',()=>{flipHorizontal=!flipHorizontal;flipHBtn.classList.toggle('active',flipHorizontal);renderPattern()});
flipVBtn.addEventListener('click',()=>{flipVertical=!flipVertical;flipVBtn.classList.toggle('active',flipVertical);renderPattern()});
convertBtn.addEventListener('click',()=>{
 try{
 const sd=imageData(sourceImg),gd=imageData(gridImg),grid=detectGrid(gd);
 // Images represent the same full canvas; map grid-image coordinates proportionally to the source.
 const rawColors=[];
 for(let y=0;y<grid.rows;y++){let row=[];for(let x=0;x<grid.cols;x++){
 const gx=(grid.xs[x]+grid.xs[x+1])/2,gy=(grid.ys[y]+grid.ys[y+1])/2;
 const sx=gx*sd.w/gd.w,sy=gy*sd.h/gd.h;
 row.push(sampleAverage(sd,sx,sy,Math.max(1,sd.w/gd.w*.8),Math.max(1,sd.h/gd.h*.8)));
 }rawColors.push(row)}
 // RGB近似統合：まず全RGBをグループ化し、代表色を確定してから全マスへ一括反映する。
 // これにより、途中で代表RGBが更新されても先に処理したマスだけ古い色が残る問題を防ぐ。
 const tolerance=6,clusters=[];
 const uniqueCounts=new Map();
 rawColors.forEach(row=>row.forEach(rgb=>{
   const key=rgb.join(',');
   uniqueCounts.set(key,(uniqueCounts.get(key)||0)+1);
 }));
 const uniqueColors=[...uniqueCounts.entries()].map(([key,count])=>({rgb:key.split(',').map(Number),count}));
 // 出現数の多い色から代表色を作り、近い色をそのグループへ加える。
 uniqueColors.sort((a,b)=>b.count-a.count);
 uniqueColors.forEach(item=>{
   let best=-1,bestDist=Infinity;
   for(let i=0;i<clusters.length;i++){
     const c=clusters[i],dr=item.rgb[0]-c.rgb[0],dg=item.rgb[1]-c.rgb[1],db=item.rgb[2]-c.rgb[2];
     const dist=Math.sqrt(dr*dr+dg*dg+db*db);
     if(dist<=tolerance&&dist<bestDist){best=i;bestDist=dist}
   }
   if(best<0){
     clusters.push({sum:item.rgb.map(v=>v*item.count),count:item.count,rgb:[...item.rgb]});
   }else{
     const c=clusters[best];
     c.sum=c.sum.map((v,i)=>v+item.rgb[i]*item.count);
     c.count+=item.count;
     c.rgb=c.sum.map(v=>Math.round(v/c.count));
   }
 });
 // 最終的に確定した代表色へ全セルを再割り当てする。
 const colors=rawColors.map(row=>row.map(rgb=>{
   let best=0,bestDist=Infinity;
   clusters.forEach((c,i)=>{
     const dr=rgb[0]-c.rgb[0],dg=rgb[1]-c.rgb[1],db=rgb[2]-c.rgb[2];
     const dist=Math.sqrt(dr*dr+dg*dg+db*db);
     if(dist<bestDist){best=i;bestDist=dist}
   });
   return [...clusters[best].rgb];
 }));
 const freq=new Map(),numberByColor=new Map();let nextNumber=1;
 colors.forEach(row=>row.forEach(c=>{const k=c.join(',');freq.set(k,(freq.get(k)||0)+1);if(!numberByColor.has(k))numberByColor.set(k,nextNumber++)}));
 const numbers=colors.map(row=>row.map(c=>numberByColor.get(c.join(','))));
 lastColors=colors;lastNumbers=numbers;flipHorizontal=false;flipVertical=false;
 flipHBtn.classList.remove('active');flipVBtn.classList.remove('active');
 renderPattern();
 document.getElementById('dimensions').textContent=`マス目：${grid.cols}列 × ${grid.rows}行`;
 document.getElementById('count').textContent=`使用色数：${freq.size}`;
 document.getElementById('cells').textContent=`総マス数：${grid.cols*grid.rows}`;
 const pal=document.getElementById('palette');pal.innerHTML='';
 [...freq.entries()].sort((a,b)=>numberByColor.get(a[0])-numberByColor.get(b[0])).forEach(([k,n])=>{const el=document.createElement('div');el.className='swatch';const c=document.createElement('span');c.className='color';c.style.background=`rgb(${k})`;const t=document.createElement('span');t.textContent=`管理番号 ${numberByColor.get(k)}｜RGB(${k})｜${n}マス`;el.append(c,t);pal.append(el)});
 downloadBtn.disabled=false;statusEl.textContent=`変換しました。\n検出結果：${grid.cols}列 × ${grid.rows}行\nRGB近似統合：距離 ${tolerance} 以下（全マス再割当て）\n色ごとに管理番号を付与しました。`;
 }catch(e){statusEl.textContent='変換できませんでした：'+e.message}
});
downloadBtn.addEventListener('click',()=>{const a=document.createElement('a');a.download='beads-pattern-numbered.png';a.href=canvas.toDataURL('image/png');a.click()});
</script>
</body></html>
